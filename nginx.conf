server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gitlab.example.com;

    ssl_certificate     /etc/letsencrypt/live/gitlab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitlab.example.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Serve a custom 403 page
    error_page 403 /custom_403.html;

    location = /custom_403.html {
        root /usr/share/nginx/html;   # adjust path to where your html file lives
        internal;                     # prevents direct access from clients
    }

    location /auth/ {
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass         http://authserver/;
      proxy_read_timeout 90;
    }

    location = /val {
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_pass         http://authserver:80/;
      proxy_read_timeout 90;
    }

    location / {
      auth_request /val;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass         http://gitlab:80;
      proxy_read_timeout 90;
    }
}
